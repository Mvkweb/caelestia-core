name: Build Caelestia Monorepo

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Make gradlew executable
      run: |
        chmod +x caelestia-paper/gradlew
        chmod +x caelestia-neoforge/gradlew

    - name: Build Paper Plugin
      run: cd caelestia-paper && ./gradlew shadowJar --no-daemon

    - name: Build NeoForge Mod
      run: cd caelestia-neoforge && ./gradlew build --no-daemon
      
    - name: Upload Paper Artifact
      uses: actions/upload-artifact@v4
      with:
        name: caelestia-paper
        path: caelestia-paper/build/libs/caelestia-paper-*.jar
        
    - name: Upload NeoForge Artifact
      uses: actions/upload-artifact@v4
      with:
        name: caelestia-neoforge
        path: caelestia-neoforge/build/libs/caelestia-*.jar
